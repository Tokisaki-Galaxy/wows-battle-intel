name: Release

# 推送 v* 标签自动发布：构建、测试、vpk 打包、上传 GitHub Release。
# 客户端自动更新读同一 Release 的 releases.win.json 作为 feed。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（如 1.1.1，不带 v 前缀）"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 构建与发布
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # git describe 需要完整历史拿 tag 距离。
          fetch-depth: 0

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: 安装 vpk
        run: dotnet tool install -g vpk

      - name: 确定版本号
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $v = "${{ inputs.version }}"
          }
          else {
            $v = "${{ github.ref_name }}".TrimStart("v")
          }
          if ($v -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "版本号 $v 不是三段 semver"
            exit 1
          }
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: 还原依赖
        run: dotnet restore WowsBattleIntel.slnx

      - name: 构建
        run: dotnet build WowsBattleIntel.slnx -c Release --no-restore

      - name: 测试
        run: dotnet test WowsBattleIntel.slnx -c Release --no-build --verbosity minimal

      - name: 发布与打包
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          pwsh tools/publish.ps1 -Version $env:RELEASE_VERSION -SmokeTest
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 上传 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = "v$env:RELEASE_VERSION"
          # vpk 上传该目录下全部 nupkg 与 releases.win.json 并发布 Release。
          $vpkOut = "dist/publish/velopack"
          vpk upload github `
            --repoUrl "https://github.com/$env:GITHUB_REPOSITORY" `
            --token $env:GH_TOKEN `
            --outputDir $vpkOut `
            --publish `
            --releaseName "WowsBattleIntel $env:RELEASE_VERSION" `
            --tag $tag
          if ($LASTEXITCODE -ne 0) { exit 1 }

          # 附加资产：Portable.zip 供新用户免安装下载，CLI 包供高级用户离线分析。
          # 两者与客户端分开分发，避免重复内嵌 ONNX 运行时。
          # vpk 命令本身没有附加资产参数，走 gh release upload。
          gh release upload $tag `
            "$vpkOut/WowsBattleIntel-win-Portable.zip" `
            "dist/publish/wows-intel-$env:RELEASE_VERSION-win-x64-cli.zip" `
            --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 写发布说明
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $tag = "v$env:RELEASE_VERSION"

          # 资产名与 vpk / publish.ps1 的产出保持一致，改名要同步。
          $setup = "WowsBattleIntel-win-Setup.exe"
          $portable = "WowsBattleIntel-win-Portable.zip"
          $cli = "wows-intel-$env:RELEASE_VERSION-win-x64-cli.zip"

          $body = @"
          ## 下载

          **运行本程序需要先安装 .NET 10 桌面运行时。** 已安装的可跳过。
          下载地址：[.NET 10 Desktop Runtime (win-x64)](https://dotnet.microsoft.com/zh-cn/download/dotnet/10.0)

          | 版本 | 适合人群 | 链接 |
          | --- | --- | --- |
          | 安装版 | 大多数用户，装完自动更新 | [$setup](https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$setup) |
          | 便携版 | 免安装，解压即用，支持自动更新 | [$portable](https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$portable) |
          | 命令行版 | 高级用户，批量分析与脚本集成 | [$cli](https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$cli) |

          普通用户从安装版与便携版里选一个下载即可，其余资产（nupkg、releases.win.json 等）是自动更新通道的内部文件，不需要下载。

          ## 安装版路径说明

          受 Velopack 打包框架的技术限制，安装版是一键静默安装：没有安装向导，无法弹出引导或选择安装路径。双击运行后直接安装到固定位置：

          ```
          %LocalAppData%\WowsBattleIntel
          ```

          即 `C:\Users\<你的用户名>\AppData\Local\WowsBattleIntel`。安装完成后自动创建桌面与开始菜单快捷方式并启动程序。

          如需手动指定安装位置，在 PowerShell 或 cmd 里带参数运行：

          ```powershell
          .\WowsBattleIntel-win-Setup.exe --installto "D:\Apps\WowsBattleIntel"
          ```

          不想装进 AppData 的用户也可以直接选便携版，解压即用，同样支持自动更新。
          "@

          # 更新日志交给 GitHub 自动生成（按 PR 与提交聚合），附在自定义
          # 说明之后，不手写 git log。gh release edit 没有 --generate-notes
          # 旗子；REST 的 PATCH releases/{id} 虽然接受 generate_release_notes，
          # 但对已有正文且无关联 PR 的仓库实测不追加 Changelog。所以先调
          # generate-notes 端点算出更新日志，拼到自定义说明后面再 PATCH。
          $id = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" --jq '.id'
          if ($LASTEXITCODE -ne 0) { exit 1 }

          $changelog = gh api -X POST "repos/$env:GITHUB_REPOSITORY/releases/generate-notes" `
            -f tag_name=$tag --jq '.body'
          if ($LASTEXITCODE -ne 0) { exit 1 }

          gh api -X PATCH "repos/$env:GITHUB_REPOSITORY/releases/$id" `
            -f body="$body`n`n$changelog" | Out-Null
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 上传构建产物（调试用，随时可下）
        uses: actions/upload-artifact@v7
        with:
          name: portable
          path: |
            dist/publish/velopack/*.zip
            dist/publish/*-cli.zip
          retention-days: 7
