name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# 同一分支的重复推送取消旧任务，节省额度。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dotnet:
    name: .NET 客户端
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: 还原依赖
        run: dotnet restore WowsBattleIntel.slnx

      - name: 构建
        run: dotnet build WowsBattleIntel.slnx -c Release --no-restore

      - name: 测试
        run: dotnet test WowsBattleIntel.slnx -c Release --no-build --verbosity normal

  python:
    name: Python 模型管线
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/ml
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 uv
        uses: astral-sh/setup-uv@v3

      - name: 安装依赖
        run: uv pip install --system -e ".[dev]"

      - name: 代码检查
        run: ruff check src tests

      - name: 测试
        run: pytest -q

  # 死代码与未使用成员探测，非阻塞。
  # 探测性质：AnalysisMode=All 只在 CI 命令行注入，不写入 csproj，避免本地开发被警告淹没。
  # 待存量清完后可移除 continue-on-error 转为阻塞。
  dead-code:
    name: 死代码探测
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: 还原依赖
        run: dotnet restore WowsBattleIntel.slnx

      # 全量分析器只在此 job 启用，失败不阻塞合并
      - name: 构建
        run: dotnet build WowsBattleIntel.slnx -c Release --no-restore /p:EnableNETAnalyzers=true /p:AnalysisMode=All /p:EnforceCodeStyleInBuild=true /p:TreatWarningsAsErrors=false 2>&1 | tee deadcode.log

      # 汇总目标规则：未使用成员、未读字段、未使用参数、可静态化成员等
      - name: 提取死代码警告
        if: always()
        run: |
          grep -E "IDE0051|IDE0052|CA1811|CA1801|CA1822|IDE0059|IDE0060" deadcode.log > deadcode-findings.txt || true
          COUNT=$(wc -l < deadcode-findings.txt)
          echo "探测到 $COUNT 条死代码相关警告"
          {
            echo "## 死代码探测报告"
            echo ""
            echo "共发现 $COUNT 条疑似死代码或未使用成员警告（探测性质，不阻塞合并）。"
            echo ""
            echo '```'
            cat deadcode-findings.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  edge:
    name: Cloudflare Workers
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/edge
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: src/edge/pnpm-lock.yaml

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm typecheck

      - name: 测试
        run: pnpm test
