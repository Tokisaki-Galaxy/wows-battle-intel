# pnpm 工作区配置。
#
# 本仓库的 edge 是单包项目，但仍使用工作区配置文件承载构建设置，
# 原因是 pnpm 10 起把「允许运行安装脚本的依赖」从这里读取。
#
# packages 字段必须存在，否则 pnpm 10 会报
# `packages field missing or empty` 并中止安装。
# 声明根目录自身为唯一包即可，不影响依赖解析。
packages:
  - "."

# 允许运行安装脚本的依赖：
# - workerd: Cloudflare Workers 运行时，vitest 与 wrangler 需要
# - esbuild: 打包依赖，wrangler 使用
# - sharp: wrangler 的图片处理依赖
#
# 两个键名并存以兼容不同 pnpm 大版本：
# - onlyBuiltDependencies 是 pnpm 10 的键名
# - allowBuilds 是 pnpm 11 的键名
onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# 供应链年龄门禁豁免。
#
# pnpm 11 默认拒绝刚发布的包（minimumReleaseAge），防止装上被投毒的新版本。
# CI 用 --frozen-lockfile 严格校验锁文件，命中即中止构建；本地交互式安装
# 只会自动豁免并告警，因此两边行为不同，必须显式列出豁免项。
#
# 豁免对象：
# - wrangler 4.151.0 与它的传递依赖 miniflare 5.20261012.0-beta
#   wrangler 是构建工具，miniflare 只被它使用，不进入运行时产物。
#   二者均为当日发布，落在默认年龄门槛内。
# 后续如升级到已过门槛的版本，可移除这两项。
minimumReleaseAgeExclude:
  - miniflare@5.20261012.0-beta
  - wrangler@4.151.0
